<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tool personali</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="livella/icons/icon-192.png">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(120% 60% at 50% 0%, #16223a 0%, #0b1220 60%) fixed, #0b1220;
    color:#e8edf7;
    font:500 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  main{max-width:560px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px}
  p.sub{color:#8d9ab4;margin:0 0 26px;font-size:14px}
  a.tool{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:#121a2a;border:1px solid #26324a;border-radius:18px;padding:14px;margin-bottom:12px;
  }
  a.tool img{width:54px;height:54px;border-radius:13px;flex:none}
  a.tool .t{font-weight:700}
  a.tool .d{color:#8d9ab4;font-size:13px;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>Tool personali</h1>
  <p class="sub">Piccoli strumenti web, pensati per l'iPhone. Aprili in Safari e aggiungili alla schermata Home.</p>
  <a class="tool" href="livella/">
    <img src="livella/icons/icon-192.png" alt="">
    <span>
      <span class="t">Livella</span>
      <span class="d">Bolla per superfici piane e verticali, con azzeramento</span>
    </span>
  </a>
</main>
</body>
</html>
